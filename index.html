<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ユグドラ幻想戦記</title>
    <link rel="stylesheet" href="style.css">
    <meta property="og:title" content="ユグドラ幻想戦記">
    <meta property="og:description" content="スマホ・PCのブラウザで遊べる無料ゲームです。インストール不要！">
    <meta property="og:url" content="https://titan11111.github.io/030-yugudora/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
</head>
<body>
    <div id="title-screen" class="screen world-screen title-screen">
        <div class="title-top">
            <p class="title-kicker">世界樹に宿る戦記</p>
            <h1 class="title-logo">ユグドラ幻想戦記</h1>
        </div>
        <div class="title-spacer" aria-hidden="true"></div>
        <div class="title-actions">
            <p class="title-blurb">敵を倒してゴールドを稼ぎ、回数つきの武器を買う。相性のわずかな差で勝つ。</p>
            <button id="start-btn" class="btn game-btn" type="button">TAP TO START</button>
            <button id="continue-btn" class="btn game-btn hidden" type="button">つづきから</button>
            <button id="album-open-btn" class="btn game-btn ghost" type="button">武器図鑑</button>
        </div>
    </div>

    <div id="story-screen" class="screen world-screen dim-screen hidden">
        <div class="story-content">
            <div class="story-text">
                <p id="story-content">ストーリーテキスト...</p>
            </div>
        </div>
        <button id="story-next-btn" class="btn game-btn" type="button">戦闘開始</button>
    </div>

    <div id="battle-screen" class="screen world-screen dim-screen hidden">
        <div class="battle-header">
            <div class="stage-badge">
                <span id="current-stage">Stage 1</span>
            </div>
            <div class="summon-gauge-container">
                <span class="gauge-label">魔力</span>
                <div id="summon-crystals" class="crystals">
                    <div class="crystal off"></div>
                    <div class="crystal off"></div>
                    <div class="crystal off"></div>
                </div>
            </div>
        </div>

        <div class="game-info">
            <div class="turn-info">
                <span id="current-turn">Player Turn</span>
            </div>
            <div class="player-status">
                <span>HP: <span id="player-hp">72</span>/<span id="player-max-hp">72</span></span>
                <span>LV: <span id="player-level">1</span></span>
                <span id="player-gold">0 G</span>
            </div>
        </div>

        <div class="equip-hud">
            <span id="equip-name">素手 残り∞</span>
            <span id="equip-meta">打 攻8 射程1</span>
        </div>

        <div id="battle-map" class="battle-map"></div>

        <div class="action-buttons">
            <button id="equip-btn" class="action-btn game-btn" type="button">武器</button>
            <button id="attack-btn" class="action-btn game-btn" type="button">攻撃</button>
            <button id="summon-btn" class="action-btn summon-btn game-btn" type="button" disabled>機兵召喚</button>
        </div>
        
        <button id="end-turn-btn" class="end-turn-btn game-btn" type="button">待機</button>
        
        <div id="guide-message" class="guide-message">手前の敵をタップすると近づいて攻撃</div>

        <div id="equip-sheet" class="sheet hidden">
            <div class="sheet-panel" data-scrollable="1">
                <p>装備を選ぶ</p>
                <div id="equip-sheet-list"></div>
                <button id="equip-sheet-close" class="btn game-btn" type="button">閉じる</button>
            </div>
        </div>
    </div>
